<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signature Canvas from Scratch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 540px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .signature-container {
      border: 2px dashed #cccccc;
      border-radius: 8px;
      background-color: #ffffff;
      display: inline-block;
    }

    canvas {
      touch-action: none; /* Disables page scrolling while drawing on touch screens */
      cursor: crosshair;
      display: block;
    }

    .button-group {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-clear {
      background-color: #f1f1f1;
      border: 1px solid #cccccc;
    }

    .btn-save {
      background-color: #0066cc;
      color: #ffffff;
      border: none;
    }

    .preview {
      margin-top: 24px;
    }

    .preview img {
      border: 1px solid #dddddd;
      padding: 8px;
      background: #f9f9f9;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h2>Signature Pad</h2>
  
  <div class="signature-container">
    <canvas id="signatureCanvas" width="500" height="200"></canvas>
  </div>

  <div class="button-group">
    <button class="btn-clear" id="clearBtn">Clear</button>
    <button class="btn-save" id="saveBtn">Capture Signature</button>
  </div>

  <div class="preview" id="previewContainer" style="display: none;">
    <h3>Exported Base64 Image:</h3>
    <img id="signatureImage" alt="Exported Signature" />
  </div>

  <script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const previewContainer = document.getElementById('previewContainer');
    const signatureImage = document.getElementById('signatureImage');

    let isDrawing = false;

    // Line and stroke styling
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Get exact cursor/finger coordinates relative to the canvas
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Start path
    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    // Draw continuous path
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); // Prevents touch drag behavior on mobile
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    // End path
    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
      }
    }

    // Mouse Listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch Listeners (Mobile & Tablet)
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Clear Canvas
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      previewContainer.style.display = 'none';
      signatureImage.src = '';
    });

    // Export Canvas Content to Base64 String
    saveBtn.addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');
      
      signatureImage.src = dataURL;
      previewContainer.style.display = 'block';

      console.log('Captured Base64 Signature String:', dataURL);
    });
  </script>
</body>
</html>
