<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Header Toast -->
    <div id="toast" class="fixed top-5 right-5 flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg transition-transform duration-300 translate-x-full z-50">
        <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-xs font-medium"></span>
    </div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-6">
        
        <!-- App Header -->
        <div class="bg-indigo-600 text-white p-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="message-square" class="w-5 h-5"></i>
                <h1 class="font-bold text-sm">Student Portal</h1>
            </div>
            <div id="student-badge" class="hidden items-center space-x-2 text-xs bg-indigo-700 px-2.5 py-1 rounded-lg">
                <span id="header-student-name" class="font-semibold"></span>
                <button onclick="logoutStudent()" class="hover:text-rose-300 ml-1">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>

        <!-- Step 1: Student Login / Verification -->
        <div id="step-login" class="p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-1">Welcome Back</h2>
            <p class="text-xs text-slate-500 mb-4">Enter your Student ID Code or Full Name to access your messages.</p>
            
            <form onsubmit="verifyStudent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Student ID / Name</label>
                    <input type="text" id="studentCodeInput" required placeholder="e.g. ST1024 or John Doe" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition-colors shadow-sm">
                    Access Portal
                </button>
            </form>
        </div>

        <!-- Step 2: Messaging View (Hidden by Default) -->
        <div id="step-messaging" class="hidden flex flex-col h-[520px]">
            
            <!-- Student Meta Bar -->
            <div class="bg-slate-50 p-3 border-b border-slate-200 text-xs flex justify-between items-center text-slate-600">
                <div>
                    <p class="font-bold text-slate-800" id="display-student-name"></p>
                    <p class="text-[10px] text-slate-400">ID: <span id="display-student-id"></span> | Grade: <span id="display-student-grade"></span></p>
                </div>
            </div>

            <!-- Thread Messages -->
            <div id="student-messages-list" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/50"></div>

            <!-- Input Area -->
            <form onsubmit="sendStudentMessage(event)" class="p-3 bg-white border-t border-slate-200 flex gap-2">
                <input type="text" id="messageText" placeholder="Type a message for your teacher..." required class="flex-1 px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-xl transition-colors">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
