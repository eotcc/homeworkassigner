<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - Send Message</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-x-full transition-transform duration-300 ease-in-out bg-white border border-slate-200 shadow-xl rounded-xl p-4 flex items-center gap-3">
    <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-indigo-600"></i>
    <span id="toast-message" class="text-sm font-medium text-slate-700"></span>
  </div>

  <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- Top Header -->
    <header class="bg-indigo-600 text-white p-5 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold">Student Messaging Portal</h1>
        <p class="text-xs text-indigo-200">NRD Tutoring</p>
      </div>
      <button onclick="logoutStudent()" id="student-badge" class="hidden items-center gap-2 bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-full text-xs transition">
        <span id="header-student-name" class="font-medium">Student</span>
        <i data-lucide="log-out" class="w-3.5 h-3.5 opacity-70"></i>
      </button>
    </header>

    <div class="p-6">
      <!-- STEP 1: Verification Card -->
      <section id="step-login" class="space-y-4">
        <div class="text-center">
          <h2 class="text-base font-semibold text-slate-800">Verify Student Access</h2>
          <p class="text-xs text-slate-500 mt-1">Enter your assigned ID Code or Full Name to access your teacher chat</p>
        </div>

        <form onsubmit="verifyStudent(event)" class="space-y-4 mt-4">
          <div>
            <label for="studentCodeInput" class="block text-xs font-semibold uppercase text-slate-500 mb-1">Student Code or Name</label>
            <input 
              type="text" 
              id="studentCodeInput" 
              placeholder="e.g. AB1234 or John Doe" 
              class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
              required
            />
          </div>
          <button 
            type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition">
            Access Portal
          </button>
        </form>
      </section>

      <!-- STEP 2: Messaging Card (Hidden by default) -->
      <section id="step-messaging" class="hidden space-y-4">
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex justify-between text-xs text-slate-600">
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">Student Name</span>
            <span id="display-student-name" class="font-semibold text-slate-800">-</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">Grade</span>
            <span id="display-student-grade" class="font-semibold text-slate-800">-</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">ID Code</span>
            <span id="display-student-id" class="font-semibold text-slate-800">-</span>
          </div>
        </div>

        <!-- Chat History Container (Only shows THIS student's messages) -->
        <div>
          <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Message History</h3>
          <div id="student-messages-list" class="space-y-2.5 max-h-64 overflow-y-auto p-2 bg-slate-50 border border-slate-200 rounded-xl custom-scrollbar">
            <p class="text-xs text-slate-400 italic text-center py-4">No messages sent yet.</p>
          </div>
        </div>

        <!-- Message Input -->
        <form onsubmit="sendStudentMessage(event)" class="space-y-2 pt-2">
          <label for="messageText" class="block text-xs font-semibold text-slate-600">Send Message to Teacher</label>
          <textarea 
            id="messageText" 
            rows="3" 
            placeholder="Type your message or question here..." 
            class="w-full p-3 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition resize-none"
            required></textarea>
          <button 
            type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            Send Message
          </button>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="student.js"></script>
</body>
</html>
